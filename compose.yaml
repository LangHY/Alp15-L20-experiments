services:
  cpu:
    profiles: [cpu]
    platform: linux/amd64
    build:
      context: .
      target: cpu
    working_dir: /workspace
    command: [python, --version]
    volumes:
      - .:/workspace:ro
  l20:
    profiles: [l20]
    platform: linux/amd64
    build:
      context: .
      target: l20
      args:
        INSTALL_FLASH_ATTN: "${INSTALL_FLASH_ATTN:-0}"
        MAX_JOBS: "${MAX_JOBS:-4}"
    gpus: all
    shm_size: 8gb
    working_dir: /workspace
    command: [python, --version]
    environment:
      HF_HOME: /cache/huggingface
      TORCH_EXTENSIONS_DIR: /tmp/torch-extensions
    volumes:
      - .:/workspace:ro
      - hf-cache:/cache/huggingface
      - torch-extensions:/tmp/torch-extensions
      - ./outputs:/outputs

volumes:
  hf-cache:
  torch-extensions:
