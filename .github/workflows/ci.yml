name: Lightweight archive checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install uv==0.11.11
      - name: Check lock and default download environment
        run: |
          uv lock --check --offline
          uv sync --frozen
          uv run --frozen python tools/restore_packaged_manifests.py
          uv pip check
          uv run --frozen python -c 'import huggingface_hub; assert huggingface_hub.__version__ == "1.31.0"'
      - name: Compile archived Python scripts without running them
        run: uv run --frozen python -m compileall -q scripts compression tests
