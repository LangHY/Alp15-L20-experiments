[project]
name = "alp15-l20-experiments"
version = "0.1.0"
description = "Archived Alpamayo 1.5 experiment scripts and reproducible environment recipes"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
# 下载脚本与旧 Transformers 使用不兼容的 Hub 版本，必须分开同步。
download = ["huggingface-hub==1.31.0"]

[project.optional-dependencies]
analysis = [
  "numpy==2.3.5",
  "pandas==2.3.3",
  "pyarrow==22.0.0",
  "matplotlib==3.10.7",
  "safetensors==0.7.0",
]
l20 = [
  "torch==2.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchvision==0.23.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "transformers==4.57.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "huggingface-hub==0.36.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "accelerate==1.12.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "physical-ai-av==0.2.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "safetensors==0.7.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "numpy==2.3.5; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "pandas==2.3.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "pyarrow==22.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "av==16.0.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "pillow==12.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "einops==0.8.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "hydra-core==1.3.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "hydra-colorlog==1.2.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "matplotlib==3.10.7; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "seaborn==0.13.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "psutil==7.1.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "packaging==25.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "ninja==1.13.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "setuptools==80.9.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
awq = [
  "nvidia-modelopt==0.39.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv]
package = false
default-groups = ["download"]
# GPU wheel 只针对 L20/Linux x86_64；Mac、Windows 和 ARM64 不声明 GPU 支持。
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'win32'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
conflicts = [
  [{ group = "download" }, { extra = "l20" }],
  [{ group = "download" }, { extra = "awq" }],
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
